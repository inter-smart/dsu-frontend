    - generic [ref=f1e144]:
      - article [ref=f1e145] [cursor=pointer]:
        - generic [ref=f1e148]:
          - generic [aria-hidden]: "01"
          - heading [level=3] [ref=f1e150]:
            - button "Unveiling a Legacy" [ref=f1e151]
        - generic:
          - generic:
            - paragraph: The foundation of every globally renowned university that exists today was laid by a visionary who dreamed of a better tomorrow. These Universities possess great historical, cultural and academic significance and have existed through centuries as beacons of knowledge, growth and prosperity.
      - article [ref=f1e153] [cursor=pointer]:
        - generic [ref=f1e156]:
          - generic [aria-hidden]: "02"
          - heading [level=3] [ref=f1e158]:
            - button "Proud to be part of DSU" [ref=f1e159]
        - generic:
          - generic:
            - paragraph: Dayananda Sagar University (DSU) is a proud member of the Dayananda Sagar Institutions family. Founded in the early sixties by the late Dayananda Sagar with just four students, DSU has now transformed into a powerhouse of global education and innovation, spanning five campuses, addressing the educational needs of over 17,000 students. Operating under the aegis of the Mahatma Gandhi Vidhya Peetha Trust, Bengaluru, DSU has enabled and empowered thousands of young Indians and international students to become globally recognised figures in a variety of fields.
      - article [ref=f1e161] [cursor=pointer]:
        - generic [ref=f1e164]:
          - generic [aria-hidden]: "03"
          - heading [level=3] [ref=f1e166]:
            - button "Best in Class Facilities" [ref=f1e167]
        - generic:
          - generic:
            - paragraph: Apart from top-tier teaching faculty, our students are provided with an excellent academic environment that fosters inspiration and promotes innovative thinking. Our campuses are equipped with lecture theatres, state-of-the-art laboratories, great libraries and top-notch computer facilities. DSU also provides comprehensive athletic facilities for students who possess an unwavering zeal for sports and games. Furthermore, our hostel facilities also include recreational activities catering for both local and international students.
      - article [ref=f1e169] [cursor=pointer]:
        - generic [ref=f1e172]:
          - generic [aria-hidden]: "04"
          - heading [level=3] [ref=f1e174]:
            - button "Inspired by Innovators" [ref=f1e175]
        - generic:
          - generic:
            - paragraph: With over 25000 sq. ft. of industry-grade labs, research, innovation, and incubation form the foundation of Dayananda Sagar University. It is committed to becoming the launchpad for the entrepreneurial aspirations of every young Indian and global student. This movement has garnered the support of many well-known industrialists and enterprise trailblazers. Industry bodies have dedicated 1 lakh square feet of modern, ready-to-move infrastructure.
      - article [ref=f1e177] [cursor=pointer]:
        - generic [ref=f1e180]:
          - generic [aria-hidden]: "05"
          - heading [level=3] [ref=f1e182]:
            - 'button "DSU Rankings: Stellar Performance, Every Single Time" [ref=f1e183]'
        - generic:
          - generic:
            - paragraph: Dayananda Sagar Institutions have consistently maintained an exemplary academic trajectory in every domain, securing a distinct and unparalleled scholastic standing among institutions of repute. In the year 2014, DSU secured 58 ranks from Visvesvaraya Technological University among 220 engineering colleges in Karnataka.
      - article [ref=f1e185] [cursor=pointer]:
        - generic [ref=f1e188]:
          - generic [aria-hidden]: "06"
          - heading [level=3] [ref=f1e190]:
            - button "Different Courses for Different Passions" [ref=f1e191]
        - generic:
          - generic:
            - paragraph: Since its inaugural academic year in 2015-2016, Dayananda Sagar University has offered a diverse range of academic programmes in a variety of disciplines, spanning from Engineering, Computer Applications, Pure Sciences, Arts and Management at Bachelor's, Masters, and PhD levels. Our academic initiatives are supported by the Centres of Excellence in ICT, Healthcare, Energy and Life Sciences, among other rapidly evolving fields of study.
