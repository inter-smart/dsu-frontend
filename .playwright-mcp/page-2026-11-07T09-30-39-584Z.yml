          - heading "About Dayananda Sagar University (DSU)" [level=2] [ref=f1e114]
          - paragraph [ref=f1e116]: The late Dayananda Sagar, a visionary educationalist and philanthropist, established Dayananda Sagar Institutions in the 1960s, committed to making knowledge accessible and transforming today’s youth into tomorrow's pioneering leaders. Following this great legacy, the Dayananda Sagar University was established in Karnataka in 2014, with a promise to deliver quality education in Southern India.
        - img "DSU" [ref=f1e120]
